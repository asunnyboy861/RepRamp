name: RepRamp
options:
  bundleIdPrefix: com.zzoutuo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JP4TN5PTS3
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  RepRamp:
    type: application
    platform: iOS
    sources:
      - path: RepRamp
        excludes:
          - "RepRamp.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.RepRamp
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: RepRamp
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "RepRamp reads your sleep, HRV, resting heart rate and body weight to adjust today's training intensity. Your health data stays on your device."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "RepRamp saves completed workouts to Apple Health so your activity rings stay accurate."
        INFOPLIST_KEY_NSCameraUsageDescription: "RepRamp uses the camera only when you start a Body Scan. Photos are analyzed in memory and never stored."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "RepRamp lets you pick a plan screenshot or progress photo for AI analysis. Images are processed in memory and never stored."
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: RepRamp/RepRamp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.zzoutuo.RepRamp
        com.apple.developer.icloud-services:
          - CloudKit
  RepRampTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RepRampTests
    dependencies:
      - target: RepRamp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.RepRampTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RepRamp:
    build:
      targets:
        RepRamp: all
        RepRampTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RepRampTests
    archive:
      config: Release
